name: Android checks
on:
  push:
    branches: [main, calm-overlay]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision local CarPlay identity (recovered from public Carlinkit firmware; not stored in source)
        run: |
          mkdir -p common/src/main/assets/offline-mfi
          printf '%s' "$MFI_IDENTITY_B64" | base64 -d > common/src/main/assets/offline-mfi/identity.pk8
          printf '%s' "$MFI_CERT_B64" | base64 -d > common/src/main/assets/offline-mfi/certificate.p7b
        env:
          MFI_IDENTITY_B64: MEECAQAwEwYHKoZIzj0CAQYIKoZIzj0DAQcEJzAlAgEBBCAv4C+7aHy52zIUZMW2bAJVb+f2A+E88wS9ep/vXJi6hg==
          MFI_CERT_B64: 
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Upload DiPlay mobile debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diplay-mobile-debug-apk
          path: mobile/build/outputs/apk/**/*.apk
          if-no-files-found: warn
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
